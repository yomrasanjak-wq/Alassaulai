name: Unzip
on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Found $ZIP"
          unzip -o "$ZIP" -d .
          rm -f "$ZIP"
          if [ -d "ALASSAUL-AI-current" ]; then
            shopt -s dotglob
            cp -rf ALASSAUL-AI-current/* . 2>/dev/null || true
            rm -rf ALASSAUL-AI-current
          fi
          ls -la
      - name: Push files
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "extract project" || true
          git push

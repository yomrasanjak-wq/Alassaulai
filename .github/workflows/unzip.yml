name: Unzip
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip files
        run: |
          for f in *.zip; do
            echo "Unzipping $f"
            unzip -o "$f" -d .
            rm "$f"
          done
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "extract project" || echo "no changes"
          git push

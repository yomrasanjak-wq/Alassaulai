name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip files
        run: |
          ls -lh
          echo "Found files:"
          find . -maxdepth 2 -name "*.zip" -type f
          unzip -o -q "ALASSAUL-AI-current.zip" -d .
          rm -f "ALASSAUL-AI-current.zip"
          ls -lh
      - name: Handle nested folder
        run: |
          if [ -d "ALASSAUL-AI-current" ]; then
            echo "Moving nested folder contents up"
            cp -r ALASSAUL-AI-current/* . 2>/dev/null || true
            cp -r ALASSAUL-AI-current/.* . 2>/dev/null || true
            rm -rf ALASSAUL-AI-current
          fi
          ls -la
      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "extract project" || echo "no changes"
          git push

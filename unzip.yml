name: Unzip

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: |
          echo "Looking for zip..."
          ls -la
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No zip found"
            exit 0
          fi
          echo "Found $ZIP"
          unzip -o "$ZIP" -d .
          rm -f "$ZIP"
          # If zip contained a folder, move its contents up
          if [ -d "ALASSAUL-AI-current" ]; then
            mv ALASSAUL-AI-current/* . 2>/dev/null || true
            rm -rf ALASSAUL-AI-current
          fi
          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "extract project files" || echo "nothing to commit"
          git push

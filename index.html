<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alassaul - النسخة النهائية الملكية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#061e1d;color:#fff}
header{background:#0a2e2d;padding:18px 30px;display:flex;justify-content:space-between;border-bottom:2px solid #c9a86a}
header h1{color:#c9a86a;font-size:20px}
.hero{height:60vh;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600');background-size:cover;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero h2{font-size:48px}.hero h2 span{color:#e8c77a}
.search-box{background:#fff;padding:14px;border-radius:20px;display:flex;gap:10px;margin-top:20px}
.search-box input{border:none;outline:none;padding:12px 18px;min-width:300px;color:#333}
.search-box button{background:#0f4c4a;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-weight:bold;cursor:pointer}
.grid{padding:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:#102f2e;border:1px solid #1f4e4d;border-radius:18px;overflow:hidden}
.card img{width:100%;height:140px;object-fit:cover}
.info{padding:10px}.info h4{color:#e8c77a}
#answer{background:#fff;color:#111;padding:20px;border-radius:15px;margin:0 30px 30px;border-right:5px solid #c9a86a;min-height:80px}
.sig{position:fixed;bottom:18px;right:18px;background:linear-gradient(135deg,#c9a86a,#e8c77a);color:#000;padding:10px 22px;border-radius:30px;font-weight:bold;z-index:9999}
</style>
</head>
<body>
<header><h1>🌲 Alassaul - الأسول | منصة العسولي</h1><div>العربية | EN</div></header>
<div class="hero">
<h2>اكتشف سحر <span>شمال تركيا</span></h2>
<p>رحلات فاخرة مصممة لك</p>
<div class="search-box"><input id="q" placeholder="اكتب: اوزنجول، طرابزون، آيدر..."><button onclick="ask()">اسأل العسولي ✨</button></div>
</div>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1524231757912-21f4fe3a7200"><div class="info"><h4>طرابزون</h4><small>120+ نشاط • 4.8</small></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4"><div class="info"><h4>أوزنجول</h4><small>الأكثر شعبية • 4.9</small></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1434725039720-aaad6dd32dfe"><div class="info"><h4>آيدر</h4><small>ينابيع حارة • 4.6</small></div></div>
</div>
<div id="answer">👋 أهلاً بك! أنا العسولي - اكتب "اوزنجول" فوق وجربني</div>
<div class="sig">العسول Alassaul © 2026</div>
<script>
const DB={اوزنجول:{t:'🏔️ بحيرة أوزنجول الساحرة',d:'جوهرة الشمال التركي! ضباب وجبال وأكواخ خشبية فاخرة، مطاعم سمك وتلفريك.'},طرابزون:{t:'🌊 طرابزون عروس البحر الأسود',d:'مدينة البحر والجبل، أسواق شعبية وفنادق 5 نجوم.'},ايدر:{t:'♨️ آيدر فوق الغيوم',d:'قرية جبلية 1350م، ينابيع حارة وشلالات.'}};
function ask(){let q=document.getElementById('q').value.trim();let o=document.getElementById('answer');let k=Object.keys(DB).find(x=>q.includes(x));if(k){o.innerHTML='<h3>'+DB[k].t+'</h3><p>'+DB[k].d+'</p>'}else{o.innerHTML='سؤالك: '+q+' - جرب: اوزنجول، طرابزون، ايدر'}}
</script>
</body>
</html>
